<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Create an Account</title>
    <meta name="description" content="Sign up for a new account via Email or Phone.">
    <!-- Google Fonts: Inter and Outfit -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <div class="background-anim"></div>
    <div class="login-container">
        <div class="login-header">
            <div class="logo">
                <!-- A slight variation for the logo icon -->
                <svg width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                    stroke-linecap="round" stroke-linejoin="round" style="color: var(--primary); margin-bottom: 16px;">
                    <path d="M16 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"></path>
                    <circle cx="8.5" cy="7" r="4"></circle>
                    <line x1="20" y1="8" x2="20" y2="14"></line>
                    <line x1="23" y1="11" x2="17" y2="11"></line>
                </svg>
            </div>
            <h1>Create an Account</h1>
            <p>Join us today! Enter your details below.</p>
        </div>

        <div class="tabs">
            <button type="button" class="tab active" data-tab="email" onclick="switchTab(this)">Email</button>
            <button type="button" class="tab" data-tab="phone" onclick="switchTab(this)">Phone</button>
        </div>

        <form id="signupForm">
            <div id="emailInputGrp" class="input-group">
                <input type="email" id="email" placeholder=" " required>
                <label for="email">Email address</label>
            </div>

            <div id="phoneInputGrp" class="input-group hidden">
                <input type="tel" id="phone" placeholder=" " pattern="[0-9]{10,14}">
                <label for="phone">Phone number</label>
            </div>

            <div class="input-group" style="margin-bottom: 8px;">
                <input type="password" id="password" placeholder=" " required
                    pattern="^(?=.*[A-Z])(?=.*\d)(?=.*[@$!%*?&])[A-Za-z\d@$!%*?&]{8,}$"
                    title="Password must be at least 8 characters long, and include an uppercase letter, a number, and a special character.">
                <label for="password">Create Password</label>
            </div>
            <p style="font-size: 12px; color: var(--text-muted); margin-bottom: 24px; padding-left: 6px;">Must be 8+
                chars (1 Uppercase, 1 Number, 1 Special)</p>

            <button type="submit" class="submit-btn" id="submitBtn">Sign up</button>

            <p class="signup-prompt">
                Already have an account? <a href="Loginpage.html">Login in</a>
            </p>
        </form>
    </div>

    <script>
        function switchTab(clickedTab) {
            const tabs = document.querySelectorAll('.tab');
            tabs.forEach(t => t.classList.remove('active'));
            clickedTab.classList.add('active');

            const tabType = clickedTab.getAttribute('data-tab');
            const emailGrp = document.getElementById('emailInputGrp');
            const phoneGrp = document.getElementById('phoneInputGrp');
            const emailInput = document.getElementById('email');
            const phoneInput = document.getElementById('phone');

            if (tabType === 'email') {
                emailGrp.classList.remove('hidden');
                phoneGrp.classList.add('hidden');
                emailInput.setAttribute('required', 'true');
                phoneInput.removeAttribute('required');
                phoneInput.value = '';
            } else {
                phoneGrp.classList.remove('hidden');
                emailGrp.classList.add('hidden');
                phoneInput.setAttribute('required', 'true');
                emailInput.removeAttribute('required');
                emailInput.value = '';
            }
        }

        // Handle Form Submission with Backend API
        document.getElementById('signupForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const btn = document.getElementById('submitBtn');
            const originalText = btn.innerText;
            btn.innerHTML = '<span class="spinner"></span> Processing...';
            btn.style.opacity = '0.9';
            btn.style.cursor = 'not-allowed';

            const isEmailTab = document.querySelector('.tab[data-tab="email"]').classList.contains('active');
            const type = isEmailTab ? 'email' : 'phone';
            const identifier = document.getElementById(type).value;
            const password = document.getElementById('password').value;

            try {
                const response = await fetch('/api/register', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ type, identifier, password })
                });

                const data = await response.json();

                if (response.ok && data.success) {
                    btn.innerHTML = data.message;
                    btn.style.background = 'linear-gradient(135deg, #10b981, #059669)';
                    // Redirect to login page after successful signup
                    setTimeout(() => {
                        window.location.href = 'Loginpage.html';
                    }, 1500);
                    return; // Prevent resetting the button immediately
                } else {
                    btn.innerHTML = data.message || 'Error occurred';
                    btn.style.background = 'linear-gradient(135deg, #ef4444, #dc2626)';
                }
            } catch (err) {
                btn.innerHTML = 'Network Error';
                btn.style.background = 'linear-gradient(135deg, #ef4444, #dc2626)';
            }

            setTimeout(() => {
                btn.innerHTML = originalText;
                btn.style.background = '';
                btn.style.opacity = '1';
                btn.style.cursor = 'pointer';
            }, 3000);
        });
    </script>
</body>

</html>
